# Telegraf has inputs only when a sensor is active: napi-api links its config
# into /etc/telegraf/telegraf.d and restarts the unit. Without a sensor Telegraf
# exits with "no inputs found" and the unit is failed after every boot.
# With the condition the unit is skipped (inactive) until the first sensor.
[Unit]
ConditionPathExistsGlob=/etc/telegraf/telegraf.d/*.conf
