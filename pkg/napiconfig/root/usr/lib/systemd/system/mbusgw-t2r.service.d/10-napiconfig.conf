# The unit of the mbusgw-t2r package (github.com/napilab/mbus-gw-t2r releases)
# starts the gateway with a fixed command line. napi-api keeps the options of
# the "Modbus multi gw" page (the trace switch) as T2R_OPTS in
# /etc/default/mbusgw-t2r: pass them. Without the package the drop-in is idle.
[Service]
EnvironmentFile=-/etc/default/mbusgw-t2r
ExecStart=
ExecStart=/usr/sbin/mbusgw-t2r --settings=/etc/mbusgw-t2r/modbus-t2r_settings.conf $T2R_OPTS
