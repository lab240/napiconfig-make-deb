# NaPi Web UI + API (package napiconfig).
# Extra locations for the HTTPS server: /etc/nginx/napi.d/*.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Web terminal tokens. napi-api picks a token from this file,
# the UI opens /tty/?token=<token>, nginx keeps it in a cookie for /tty/ws.
map $arg_token $napi_tty_arg_ok {
    default 0;
    include /etc/nginx/ttyd_tokens.map;
}

map $cookie_napi_tty $napi_tty_cookie_ok {
    default 0;
    include /etc/nginx/ttyd_tokens.map;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2: /etc/nginx/napi.d/00-http2.conf (napiconfig postinst, nginx >= 1.25.1)
    client_max_body_size 1G;
    server_tokens off;

    ssl_certificate /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
    ssl_session_tickets off;

    # modern configuration
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS (63072000 seconds)
    add_header Strict-Transport-Security "max-age=63072000" always;

    root /usr/share/napiconfig/html;

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /tty/ {
        set $napi_tty_ok "$napi_tty_arg_ok$napi_tty_cookie_ok";
        if ($napi_tty_ok = "00") {
            return 403;
        }
        if ($napi_tty_arg_ok = 1) {
            add_header Set-Cookie "napi_tty=$arg_token; Path=/tty/; Secure; HttpOnly; SameSite=Strict";
        }

        proxy_pass http://unix:/run/napi-ttyd/ttyd.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;
        proxy_buffering off;
    }

    include /etc/nginx/napi.d/*.conf;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}
